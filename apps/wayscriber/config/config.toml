# All settings are optional. If not specified, defaults will be used.
#
# Every value here is a configured default: the value Wayscriber starts from.
# Edit them in the graphical configurator (`wayscriber-configurator`, or F11
# from the overlay) or by hand. Two things write this file: the configurator's
# Save, and the overlay's three narrow editors — shortcut edit/unbind/reset,
# preset save/clear, and quick-color recoloring — each of which rewrites only
# its own key at the moment you confirm the edit and copies the previous file
# to a timestamped .bak. Running, using, and quitting Wayscriber never changes
# it on its own, and a preference you flip from the overlay applies to that run
# only.
#
# Overlay changes to toolbar pins, minimized/pane/collapsed state, toolbar item
# visibility/order, and board pins are direct interaction state, stored
# separately in $XDG_DATA_HOME/wayscriber/runtime-ui.toml (normally
# ~/.local/share/wayscriber/runtime-ui.toml). Reset those generated runtime
# preferences from the overlay Settings panel; do not hand-edit them.
#
# Delete this config file only to reset authored settings to built-in defaults.

# Which generation of shipped keybinding defaults this file was written
# against. Loading never changes it; the configurator offers a reviewed update
# when it is behind. Keep this value when editing the file.
config_revision = 3

# TODO: im too lazy to go through all the keybinds,
# keeping the defaults explicitly to modify them when I need them
[keybindings]
# Customize keyboard shortcuts for all actions
# Format: key names with modifiers separated by +
# Examples: "Escape", "Ctrl+Z", "Super+X", "Ctrl+Shift+T", "F10",
# "MouseBack", "Ctrl+MouseForward", "StylusPrimary",
# "Ctrl+K > Ctrl+C"
# Super also accepts Meta, Logo, Win, and Windows.
# Auxiliary mouse buttons: MouseBack, MouseForward, MouseExtra1–MouseExtra4.
# Stylus barrel buttons: StylusPrimary, StylusSecondary.
# Keyboard sequences use `>` between two or three chords (Ctrl+K > Ctrl+C).
# Commas still separate independent shortcuts: F5, Ctrl+K > Ctrl+C
# A standalone chord cannot also be a sequence prefix.
# Left, middle, and right cannot be bound as actions.
# Each action can have multiple keybindings (e.g., ["+", "="])

exit = ["Escape", "Q"]
# enter insert mode
enter_text_mode = ["I"]
enter_sticky_note_mode = ["N"]
undo = ["U"]
redo = ["Ctrl+R"]

clear_canvas = ["D"]

# Duplicate currently selected annotations
duplicate_selection = ["Ctrl+D"]

# Copy/paste selected annotations
copy_selection = ["Ctrl+Alt+C"]
paste_selection = ["Ctrl+Alt+V"]

# Select all annotations
select_all = ["Ctrl+A"]

# Reorder selected annotations within the stack
move_selection_to_front = ["]"]
move_selection_to_back = ["["]

# Nudge? move a selected drawing by a small amount using the keyboard
# Nudge selected annotations (hold Shift for a larger step)
nudge_selection_up = ["ArrowUp"]
nudge_selection_down = ["ArrowDown"]
nudge_selection_left = ["ArrowLeft", "Shift+PageUp"]
nudge_selection_right = ["ArrowRight", "Shift+PageDown"]

# Nudge selected annotations (large step)
nudge_selection_up_large = ["PageUp"]
nudge_selection_down_large = ["PageDown"]

# Move selection to horizontal edges (left/right)
move_selection_to_start = ["Home"]
move_selection_to_end = ["End"]

# Move selection to vertical edges
move_selection_to_top = ["Ctrl+Home"]
move_selection_to_bottom = ["Ctrl+End"]

delete_selection = ["Delete"]

# Adjust pen thickness
increase_thickness = ["+"]
decrease_thickness = ["-"]

# Adjust marker opacity (when using the marker tool)
increase_marker_opacity = ["Ctrl+Alt+ArrowUp"]
decrease_marker_opacity = ["Ctrl+Alt+ArrowDown"]

# Tool selection shortcuts (optional; keep empty to rely on modifiers)
select_selection_tool = ["V"]
select_pen_tool = ["F"]
select_marker_tool = ["H"]
select_eraser_tool = ["E"]
# Toggle eraser behavior mode
toggle_eraser_mode = ["Ctrl+Shift+E"]

toggle_highlight_tool = ["Ctrl+Alt+H"]

# Reset label counters
reset_arrow_labels = ["Ctrl+Shift+R"]

# Adjust font size
increase_font_size = ["Ctrl+Shift++", "Ctrl+Shift+="]
decrease_font_size = ["Ctrl+Shift+-", "Ctrl+Shift+_"]

# Board mode toggles (only if board.enabled = true)
toggle_whiteboard = ["Ctrl+W"]
toggle_blackboard = ["Ctrl+B"]
return_to_transparent = ["Ctrl+Shift+T"]
# Cycle overlay focus across monitors (layer-shell + xdg fullscreen fallback)
focus_prev_output = ["Ctrl+Alt+Shift+ArrowLeft"]
focus_next_output = ["Ctrl+Alt+Shift+ArrowRight"]
# Board slots and board management
board_1 = ["Ctrl+Shift+1"]
board_2 = ["Ctrl+Shift+2"]
board_3 = ["Ctrl+Shift+3"]
board_4 = ["Ctrl+Shift+4"]
board_5 = ["Ctrl+Shift+5"]
board_6 = ["Ctrl+Shift+6"]
board_7 = ["Ctrl+Shift+7"]
board_8 = ["Ctrl+Shift+8"]
board_9 = ["Ctrl+Shift+9"]
board_prev = ["Ctrl+Shift+ArrowLeft"]
board_next = ["Ctrl+Shift+ArrowRight"]
board_new = ["Ctrl+Shift+N"]
board_duplicate = ["Ctrl+Shift+D"]
board_delete = ["Ctrl+Shift+Delete"]
board_picker = ["Ctrl+Shift+B"]

# Page navigation
# Ubuntu/GNOME defaults avoid Ctrl+Alt workspace shortcuts (Ctrl+ArrowLeft/Right, Ctrl+PageUp/PageDown).
page_prev = ["Ctrl+Alt+ArrowLeft", "Ctrl+Alt+PageUp"]
page_next = ["Ctrl+Alt+ArrowRight", "Ctrl+Alt+PageDown"]
page_new = ["Ctrl+Alt+N"]
page_duplicate = ["Ctrl+Alt+D"]
page_delete = ["Ctrl+Alt+Delete"]

toggle_help = ["Shift+?", "F1"]

# Toggle quick reference overlay
toggle_quick_help = ["Shift+F1"]

# Toggle status bar
toggle_status_bar = ["F12", "F4"]

# Show/hide the floating board/page badge (unbound; also in the command palette)
toggle_floating_badge = []

# Show/hide the bottom-right zoom chip (unbound; also in the command palette)
toggle_zoom_chip = []

# Focus mode: hide all UI chrome at once, press again to restore exactly
# (unbound; also in the command palette)
toggle_focus_mode = []

# Toggle the unified top toolbar
toggle_toolbar = ["F9"]

# Cycle the top toolbar's display: full strip -> micro chip -> hidden
# (F2 used to toggle the toolbars; the cycle still reaches hidden)
cycle_toolbar_display = ["F2"]

# Toggle click highlight
toggle_click_highlight = ["Ctrl+Shift+H"]

# Toggle the input HUD (on-screen keystrokes and clicks)
toggle_input_hud = ["Ctrl+Shift+K"]

# Toggle presenter mode
toggle_presenter_mode = ["Ctrl+Shift+M"]

# Toggle light passthrough mode while the overlay has focus.
# Once passthrough is active, use compositor/global shortcuts that call
# `wayscriber --light-toggle` for reliable control, including exit.
toggle_light_mode = ["F6"]

# Optional in-overlay toggle between light drawing and passthrough.
# In passthrough, use `wayscriber --light-draw-toggle`
# or `--light-draw-on` / `--light-draw-off` from a compositor shortcut.
toggle_light_mode_drawing = []

# Optional render color profile preview controls
render_profile_next = []
render_profile_previous = []
render_profile_off = []

# Toggle fill for fill-capable shapes
toggle_fill = []

# Optional keyboard binding to toggle radial menu at cursor
toggle_radial_menu = []

# Toggle selection properties panel
toggle_selection_properties = ["Ctrl+Alt+P"]

# Toggle context menu (keyboard alternative to right-click)
open_context_menu = ["Shift+F10", "Menu"]

# Launch the desktop configurator (requires wayscriber-configurator)
open_configurator = ["F11"]

# Toggle command palette
toggle_command_palette = ["Shift+:"]

# Color selection shortcuts
set_color_red = ["R"]
set_color_green = ["G"]
set_color_blue = ["B"]
set_color_orange = ["O"]
set_color_white = ["W"]
set_color_black = ["K"]
# unbinding, yellow "Y". who needs this many colors
set_color_yellow = []
# remove P from pink to allow P for picker
set_color_pink = []

# Screen eyedropper (also available from color UIs and command palette)
# NOTE: requests permission. dont think i want to enable that by default.
# this app is way to bloated to give permission by default.
# (tho it would prob be fine)
pick_screen_color = ["P"]

# Select a screen region and copy the text recognized in it (needs Tesseract).
# Unbound by default: "O" is already the orange quick color.
copy_text_from_screen = []

# Toggle frozen mode
toggle_frozen_mode = ["Ctrl+Shift+F"]

# Zoom controls
zoom_in = ["Ctrl+Alt++", "Ctrl+Alt+="]
zoom_out = ["Ctrl+Alt+-", "Ctrl+Alt+_"]
reset_zoom = ["Ctrl+Alt+0"]
toggle_zoom_lock = ["Ctrl+Alt+L"]
refresh_zoom_capture = ["Ctrl+Alt+R"]

# Preset slots (apply/save/clear).
# idunno what presets are, but sounds like
# they write to my config file
# I shall not have it so.
apply_preset_1 = []
apply_preset_2 = []
apply_preset_3 = []
apply_preset_4 = []
apply_preset_5 = []
save_preset_1 = []
save_preset_2 = []
save_preset_3 = []
save_preset_4 = []
save_preset_5 = []
clear_preset_1 = []
clear_preset_2 = []
clear_preset_3 = []
clear_preset_4 = []
clear_preset_5 = []


[updates]
# Wayscriber never installs updates. This section only controls whether it tells
# you that a newer release exists and points at the instructions for your
# install method (https://wayscriber.com/docs/getting-started/updating.html).

# Ask https://wayscriber.com/latest.json whether a newer release exists.
# No Wayscriber or user identifier is sent, and the client version is suppressed.
check = false
# Show one desktop notification per release. With this off, the notice still
# appears in the About window and the tray menu.
notify = false

[ui]
theme = "dark"

# Show automatic first-run guidance, discovery tips, and shortcut coaching.
# The guided tour remains available manually when this is false.
# WARN: this is extermely annoying
show_onboarding_hints = false

[drawing]
# Default pen color
# Options: "red", "green", "blue", "yellow", "orange", "pink", "white", "black"
# (named colors resolve to the tuned quick color palette, e.g. "red" = #F5333F)
# Or #RRGGBB hex: "#FFB3BA", or #RRGGBBAA for alpha: "#FFB3BA80"
# Or RGB array: [255, 0, 0], or RGBA array: [255, 0, 0, 128]
default_color = "orange"

# Falls back to "Sans" if the specified font is not available
font_family = "Noto Sans"


[performance]
# Number of buffers for rendering (2, 3, or 4)
# 2 = double buffering (low memory)
# 3 = triple buffering (recommended, smooth)
# 4 = quad buffering (ultra-smooth on high refresh displays)
buffer_count = 3

enable_vsync = false

# Max FPS when VSync is disabled (0 = unlimited)
# 120 keeps pen latency low without uncapped CPU usage; set to 0 only for profiling
max_fps_no_vsync = 60

# UI animation frame rate (0-240; 0 = unlimited)
# Higher values smooth UI effects at the cost of more redraws
ui_animation_fps = 30

[capture]
# Enable screenshot shortcuts (set to false to disable all capture actions)
enabled = false

