general {
  hide_cursor = true
	ignore_empty_input = true
	fail_timeout = 2000
	grace = 0
	no_fade_in = false
}

animation {
    bezier = fast, 0, 0, 0, 1
    bezier = appleOut, 0.7, 0, 0.2, 1
    animation = fadeIn, 1, 6, fast
    animation = fadeOut, 1, 6, appleOut
}
background {
    monitor =
    path = $HOME/.config/hypr/i-am-root/groot-relaxing-in-grass.jpg
    blur_passes = 2
    blur_size = 4
    brightness = 0.6 
    vibrancy = 0.1
    noise = 0.01
}

image {
    monitor =
    path = $HOME/.config/hypr/i-am-root/good_morning_groot.jpg
    size = 150
		border_size = 0

    position = 0, 200
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(7f5338ff) rgba(fbc50dff) rgba(8d962fff) 45deg
    check_color=rgba(fbc50dff) rgba(ff6633ee) 120deg
    fail_color=rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}

label {
  monitor =
	text = It's not much of a screen, but I'm sort of attached to it.
	text = whoami? I am /root
	color = rgba(200, 200, 200, 1.0)
	font_size = 25
	font_family = Noto Sans

	position = 0, 80
	halign = center
	valign = center
}
