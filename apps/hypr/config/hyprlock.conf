general {
  hide_cursor = true
	ignore_empty_input = true
	fail_timeout = 2000
}

background {
  monitor = 
	# path = $HOME/.config/hypr/hypr_chan.png
	path = screenshot
	blur_passes = 2
	blur_size = 4
}

image {
    monitor =
    path = $HOME/.config/hypr/eeyore.png
    size = 150
		border_size = 0

    position = 0, 200
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color=rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color=rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    position = 0, -20
    halign = center
    valign = center
}

