# CPU
label {
    monitor =
    text = cmd[update:3000] bash -c '\
        val=$(cat ~/.cache/ribyn/hypr/cpu_usage); \
        bar=$(~/.config/hypr/golubchik/bar.sh $val 16); \
        printf "CPU  %s %3d%%" "$bar" "$val"'
    color = #aaaaee
    font_size = 17
    # font_family = JetBrainsMono Nerd Font
    position = -300, 260
    halign = right
    valign = bottom
}

# GPU
label {
    monitor =
    text = cmd[update:5000] bash -c '\
        val=$(~/.config/hypr/golubchik/gpu_usage.sh); \
        bar=$(~/.config/hypr/golubchik/bar.sh $val 16); \
        printf "GPU  %s %3d%%" "$bar" "$val"'
    color = $on_primary
    font_size = 17
    # font_family = JetBrainsMono Nerd Font
    position = -250, 230
    halign = right
    valign = bottom
}

# MEMORY
label {
    monitor =
    text = cmd[update:4500] bash -c '\
        val=$(~/.config/hypr/golubchik/mem_usage.sh); \
        bar=$(~/.config/hypr/golubchik/bar.sh $val 16); \
        printf "MEM  %s %3d%%" "$bar" "$val"'
    color = #ffeaaa
    font_size = 17
    # font_family = JetBrainsMono Nerd Font
    position = -200, 200
    halign = right
    valign = bottom
}
