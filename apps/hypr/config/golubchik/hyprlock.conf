# NOTE: to test the thing
# hyprlock --no-fade-in --grace 30000 --config $HOME/ribynlinux/apps/hypr/config/golubchik/hyprlock.conf
general {
    disable_loading_bar = true
    hide_cursor = true
    ignore_empty_input = true
    grace = 0
    no_fade_in = false
}

animation {
    # fadeIn
    #bezier = snappy, 0.4, 0, 0.2, 1
    #bezier = smooth, 0.25, 0.1, 0.25, 1
    #bezier = bounce, 0.175, 0.885, 0.32, 1.275
    #bezier = material, 0.05, 0.7, 0.1, 1
    bezier = fast, 0, 0, 0, 1
    #bezier = pulse, 0.445, 0.05, 0.55, 0.95
    #bezier = quint, 0.83, 0, 0.17, 1
    #bezier = overshot, 0.05, 0.9, 0.1, 1.1
    # fade Out
    #bezier = instant, 1, 0, 1, 1
    #bezier = easeIn, 0.4, 0, 1, 1
    #bezier = quintIn, 0.64, 0, 0.78, 0
    bezier = appleOut, 0.7, 0, 0.2, 1
    #bezier = linear, 0, 0, 1, 1
    #bezier = incinerate, 0.8, 0, 1, 1
    # applying animations
    animation = fadeIn, 1, 6, fast
    animation = fadeOut, 1, 6, appleOut
}

background {
    monitor =
    path = $HOME/.config/hypr/car-in-grass.jpg
    blur_passes = 2
    blur_size = 4
    brightness = 0.6 
    vibrancy = 0.1
    noise = 0.01
}

# clock hours
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H")"
    #text = $TIME
    color = #ffeccc
    font_size = 100
    font_family = StretchPro
    halign = left
    valign = top
    position = 175, -175
}

# clock minutes
label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%M")"
    color = #ffeaaa
    font_size = 95
    # font_family = StretchPro
    halign = left
    valign = top
    position = 340, -220
}

