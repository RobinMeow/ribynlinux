music_directory "~/Music"

playlist_directory "~/.config/mpd/playlists"

# If you use systemd, do not configure a pid_file.
pid_file "~/.local/share/mpd/pid"

db_file "~/.local/share/mpd/database"

# when using systemd, this line is not needed
log_file "~/.local/share/mpd/log"

sticker_file "~/.local/share/mpd/sticker.sql"

state_file "~/.local/state/mpd/state"

# This setting can deny access to control of the daemon. Not effective if
# systemd socket activation is in use.
# For network
bind_to_address "127.0.0.1"

# And for Unix Socket
#bind_to_address		"~/.mpd/socket"

# This setting is the TCP port that is desired for the daemon to get assigned to.
#port				"6600"

# Input
#
input {
        plugin "curl"
#       proxy "proxy.isp.com:8080"
#       proxy_user "user"
#       proxy_password "password"
}

# Audio Output
#
# MPD supports various audio output types, as well as playing through multiple
# audio outputs at the same time, through multiple audio_output settings
# blocks. Setting this block is optional, though the server will only attempt
# autodetection for one sound card.

audio_output {
	type "pulse"
	name "PulseAudio output"
#	server "remote_server" # optional
#	sink "remote_server_sink" # optional
#	media_role "media_role" #optional
  mixer_type "software"
}

# NOTE: pipewire works, but defining both, means 
# double playback and PulseAudio works just fine
#
# audio_output {
#         type            "pipewire"
#         name            "PipeWire output"
#         # Optional
#         #target          "bluez_output.F4_9D_8A_B4_8D_37.1"
# }

# Use "verbose" for troubleshooting.
#log_level			"notice"
